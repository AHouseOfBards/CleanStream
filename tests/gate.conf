# tests/gate.conf: CleanStream's settings for tests/gate.sh (sourced by sh).

PROJECT=Jellyfin.Plugin.CleanStream/Jellyfin.Plugin.CleanStream.csproj
TEST_PROJECTS="Jellyfin.Plugin.CleanStream.Tests"

# Runs on every `git push` (bash guard). The catalog reads manifest.json straight from main, so a broken one breaks
# installs for everyone the moment it lands. There's no Node on the dev machine, so PowerShell parses it.
manifest_parses() {
    ps=$(command -v pwsh || command -v powershell.exe || command -v powershell) || { echo "no PowerShell to parse manifest.json"; return 1; }
    "$ps" -NoProfile -NonInteractive -Command "try { Get-Content -Raw manifest.json | ConvertFrom-Json | Out-Null } catch { Write-Output \$_.Exception.Message; exit 1 }"
}
gate_prepush() {
    step manifest manifest_parses
}
gate_extra() {
    step manifest manifest_parses
}
